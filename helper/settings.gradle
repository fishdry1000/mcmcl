pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

rootProject.name = "mcmcl-hmcl-helper"

// HMCL does not currently publish a stable HMCLCore artifact.  This optional
// composite-build hook is intentionally dormant unless hmclCheckout is set.
def hmclCheckout = providers.gradleProperty("hmclCheckout").orNull
if (hmclCheckout != null && !hmclCheckout.isBlank()) {
    includeBuild(file(hmclCheckout)) {
        dependencySubstitution {
            substitute module("org.jackhuang:HMCLCore") using project(":HMCLCore")
            substitute module("HMCL3:HMCLCore") using project(":HMCLCore")
        }
    }
}
